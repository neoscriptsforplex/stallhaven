name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Stamp model cache-bust
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            const sha = (process.env.GITHUB_SHA || '').slice(0, 12);
            writeFileSync('src/game/modelrev.js',
              '/** Stamped by the Pages workflow. */\nexport const MODEL_ASSET_REV = ' + JSON.stringify(sha) + ';\n');
          "

      - name: Cache milestone node_modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stallhaven-archive-nm
          key: stallhaven-archive-nm-${{ hashFiles('package-lock.json') }}

      - name: Build version archive
        env:
          STALLHAVEN_NM_CACHE: ${{ runner.temp }}/stallhaven-archive-nm
        run: node scripts/build-versions.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Mirror public/ to site root
        # Pages serves the repo unbuilt, so ./icons, ./music, ./textures, ./models etc
        # (Vite public/ paths) must also exist at the root. No-clobber keeps repo files.
        run: cp -rn public/. .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
